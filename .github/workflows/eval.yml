name: eval

# Scores speech-to-text models on Egyptian Arabic. Run it from the Actions tab.
on:
  workflow_dispatch:
    inputs:
      models:
        description: Comma-separated Hugging Face model ids (empty = the default candidates)
        required: false
        default: ''
      limit:
        description: Number of test clips
        required: false
        default: '100'

permissions:
  contents: read

jobs:
  egyptian-asr:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: eval/requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y libsndfile1
      - run: pip install -r eval/requirements.txt
      - name: Score models
        env:
          MODELS: ${{ inputs.models }}
          LIMIT: ${{ inputs.limit }}
        run: |
          args=(--limit "${LIMIT:-100}")
          if [ -n "$MODELS" ]; then args+=(--models "$MODELS"); fi
          python eval/score_models.py "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: egyptian-asr-results
          path: eval/results/
