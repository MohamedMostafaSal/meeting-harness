name: web

on:
  push:
    paths: ['web/**', '.github/workflows/web.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
      - name: Smoke test with real models
        run: npm run smoke

  # GitHub Pages: deploys on push when the repo is public, or on a manual run
  # (needs Settings › Pages › Source: GitHub Actions; private repos need a paid plan).
  deploy:
    needs: test
    if: github.ref == 'refs/heads/master' && (github.event_name == 'workflow_dispatch' || !github.event.repository.private)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: mkdir _site && cp web/*.html web/*.js web/*.css _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
