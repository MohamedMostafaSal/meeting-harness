name: youtube

# Scores the web harness and the iPhone app's Egyptian Arabic model on a test set made from
# a YouTube video by eval/youtube_test.sh (run on your own computer: YouTube asks cloud
# machines to sign in, so the download happens there). Pass a direct download link to the
# yt-testset.zip it makes. Only scores and transcripts are kept, as a short-lived artifact.
on:
  workflow_dispatch:
    inputs:
      testset:
        description: Direct download link to yt-testset.zip (audio.wav, cues.json, info.json)
        required: true
      preset:
        description: Web models (light or balanced)
        default: balanced

permissions:
  contents: read

jobs:
  harness:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Get the test set
        env:
          TESTSET: ${{ inputs.testset }}
        run: curl -fsSL "$TESTSET" -o testset.zip && unzip -q testset.zip -d yt && rm testset.zip
      - name: Run the web harness and score it
        working-directory: web
        run: |
          npm install --no-audit --no-fund
          node test/youtube.js ../yt "${{ inputs.preset }}"
      - name: Summary
        if: always()
        run: |
          python3 -c "import json;i=json.load(open('yt/info.json'));print(f\"# {i['title']}\n\nFirst {i['seconds']/60:.0f} min, scored against {i['captions']} captions ({i['language']}, {i['cues']} cues).\n\")" >> "$GITHUB_STEP_SUMMARY" || true
          cat yt/score.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: youtube-harness
          retention-days: 7
          path: |
            yt/info.json
            yt/score.md
            yt/harness.md
            yt/harness.json
            yt/side-by-side.md

  iphone-model:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build WhisperKit's CLI
        run: |
          git clone --depth 1 --branch v1.1.1 https://github.com/argmaxinc/argmax-oss-swift /tmp/argmax
          cd /tmp/argmax && swift build -c release --product argmax-cli
      - name: Get the test set
        env:
          TESTSET: ${{ inputs.testset }}
        run: curl -fsSL "$TESTSET" -o testset.zip && unzip -q testset.zip -d yt && rm testset.zip
      - name: Run the Core ML model and score it
        run: python eval/youtube_coreml.py yt --cli /tmp/argmax/.build/release/argmax-cli
      - name: Summary
        if: always()
        run: cat yt/score-coreml.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: youtube-iphone-model
          retention-days: 7
          path: |
            yt/score-coreml.md
            yt/coreml.txt
