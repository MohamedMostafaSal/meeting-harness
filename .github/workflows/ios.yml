name: ios

# Builds the iPhone app for the simulator and runs its unit tests on macOS.
on:
  push:
    paths: ['App/**', 'Sources/HarnessCore/**', 'Package.swift', '.github/workflows/ios.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: App
    steps:
      - uses: actions/checkout@v4
      - name: Xcode version
        run: xcodebuild -version
      - name: Generate the Xcode app project
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -list -project Harness.xcodeproj
      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild build -project Harness.xcodeproj -scheme Harness \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO > build.log 2>&1 || true
          grep -E "error:|BUILD (SUCCEEDED|FAILED)" build.log | sort -u | head -150 || true
          grep -q "BUILD SUCCEEDED" build.log

  screenshots:
    needs: build
    if: github.ref == 'refs/heads/master'
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Generate the Xcode host app
        working-directory: App
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Pick a simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,re,sys
          runtimes=json.load(sys.stdin)['devices']
          def version(rt): return [int(x) for x in re.findall(r'(\\d+)', rt.split('iOS')[-1])] if 'iOS' in rt else [-1]
          for rt in sorted(runtimes, key=version, reverse=True):
              phones=[d for d in runtimes[rt] if d['name'].startswith('iPhone')]
              pro=[d for d in phones if d['name'].endswith('Pro')]
              if pro or phones:
                  print((pro or phones)[-1]['udid']); break")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices | grep "$UDID"
      - name: Build the app
        working-directory: App
        run: |
          xcodebuild build -project Harness.xcodeproj -scheme Harness \
            -destination "id=${{ steps.sim.outputs.udid }}" -derivedDataPath build \
            -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO | tee build.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log
      - name: Take screenshots
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          APP=$(find App/build/Build/Products -name "Harness.app" -maxdepth 3 | head -1)
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --wifiBars 3 --cellularBars 4 || true
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl privacy "$UDID" grant microphone io.github.mohamedmostafasal.meetingharness || true
          mkdir -p docs/screenshots
          for appearance in light dark; do
            xcrun simctl ui "$UDID" appearance $appearance
            for screen in library meeting recording settings models onboarding; do
              xcrun simctl launch --terminate-running-process "$UDID" io.github.mohamedmostafasal.meetingharness -demo -screen $screen
              sleep 6
              xcrun simctl io "$UDID" screenshot "docs/screenshots/ios-$screen-$appearance.png"
            done
          done
          ls -la docs/screenshots
      - uses: actions/upload-artifact@v4
        with:
          name: ios-screenshots
          path: docs/screenshots/
      - name: Commit screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          git diff --cached --quiet && exit 0
          git commit -m "Update iOS screenshots"
          git pull --rebase origin master
          git push origin HEAD:master
